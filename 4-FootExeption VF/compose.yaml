services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: foot-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-Oracle123}
      APP_USER: footform
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-footform}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./Base.sql:/container-entrypoint-initdb.d/user_01-base.sql:ro

volumes:
  oracle-data: