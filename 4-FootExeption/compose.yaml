services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-Oracle123}
      APP_USER: footform
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-footform}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./Base.sql:/container-entrypoint-initdb.d/user_01-base.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  app:
    build: .
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      DB_HOST: oracle
      DB_PORT: "1521"
      DB_SERVICE: FREEPDB1
      DB_USER: footform
      DB_PASSWORD: ${APP_USER_PASSWORD:-footform}
    ports:
      - "127.0.0.1:6080:6080"
    restart: unless-stopped

volumes:
  oracle-data: